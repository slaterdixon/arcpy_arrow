[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arcpy_arrow"
version = "0.1.0"
description = "Arrow-based helpers for moving data between ArcPy and dataframes"
requires-python = ">=3.11"
dependencies = [
    # All runtime dependencies (pandas, geopandas, pyarrow, shapely, arcpy)
    # are expected to be present in the ArcGIS Pro conda environment.
    # They are intentionally omitted here to prevent pip from installing
    # conflicting versions over the conda-managed packages.
]

[project.optional-dependencies]
polars = ["polars"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]







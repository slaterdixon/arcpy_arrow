[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arcpy_arrow"
version = "0.1.0"
description = "Arrow-based helpers for moving data between ArcPy and dataframes"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "polars",
    "geopandas",
    "pyarrow",
    "shapely",
    # arcpy is provided by ArcGIS Pro's environment
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]







{% set version = "0.1.0" %}

package:
  name: arcpy_arrow
  version: {{ version }}

source:
  url: https://github.com/slaterdixon/arcpy_arrow/archive/refs/tags/v{{ version }}.tar.gz
  sha256: <fill in>

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=77
  run:
    - python >=3.11
    - shapely
    - geopandas
    # arcpy, pandas, pyarrow come from arcgispro-py3; checked at import time

test:
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/<you>/arcpy_arrow
  summary: Arrow-based helpers for moving data between ArcPy and dataframes
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - slaterdixon

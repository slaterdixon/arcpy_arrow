{% set version = "0.1.0" %}

package:
  name: arcpy_arrow
  version: {{ version }}

source:
  git_url: https://github.com/slaterdixon/arcpy_arrow.git
  git_rev: v{{ version }}


build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=77
  run:
    - python >=3.11
    - shapely
    - geopandas
    # arcpy, pandas, pyarrow come from default ESRI conda env.

test:
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/slaterdixon/arcpy_arrow
  summary: Arrow-based helpers for roundtripping ArcGIS data with Python dataframes
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - slaterdixon